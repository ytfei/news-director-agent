[project]
name = "news-director-api"
version = "0.1.0"
description = "主理人 Agent — 观点驱动的内容生产工作台（API / Worker）"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ORM / 迁移
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # 缓存 / 队列
    "arq>=0.26",
    "redis>=5.2",
    # 数据源
    "tushare>=1.4.19",
    "httpx>=0.28",
    # 模型（OpenAI 兼容协议，含火山方舟 Ark）
    "openai>=1.60",
    # 日志
    "structlog>=24.4",
    # 工具
    "python-dateutil>=2.9",
    # 凭据加密（Fernet / 私有化场景）
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
