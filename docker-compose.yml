# ============================================================================
# 主理人 Agent · 全栈部署（api / worker / web + 依赖）
#
#   make up        # 构建并启动，web → :8080，api → :8000
#   make logs      # 跟随日志
#   make down      # 停止（保留数据卷）
#
# 与 infra/docker-compose.yml 的分工（两者**可以同时运行，端口不冲突**）：
#   - infra/…   仅基础设施，把 5433 / 6380 / 9000 暴露给宿主机 → 本地跑代码用
#   - 本文件     完整应用栈，pg / redis / minio **只在内部网络**，不占宿主机端口
#
# ⚠️ 服务名 `api` 会被 web 的 nginx 用作上游地址（${API_UPSTREAM}），改名需同步。
# ============================================================================

name: nda

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-prod}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://nda:${POSTGRES_PASSWORD:-nda}@postgres:5432/nda
  DATABASE_URL_SYNC: postgresql+psycopg://nda:${POSTGRES_PASSWORD:-nda}@postgres:5432/nda
  REDIS_URL: redis://redis:6379/0
  # ★ 必须与库中 news_items.embedding 的实际维度一致，否则写入直接报错。
  #   当前库里是 vector(2048)；改这个值 = 需要重建向量列与索引（见 TODO P0-2）。
  EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
  # ---- 模型（OpenAI 兼容协议；火山方舟 Ark） ----
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # 三档：pro 只用于复杂规划（慢），turbo 为默认甜点，lite 用于批量
  LLM_MODEL_PRO: ${LLM_MODEL_PRO:-doubao-seed-2.1-pro}
  LLM_MODEL_TURBO: ${LLM_MODEL_TURBO:-doubao-seed-2.1-turbo}
  LLM_MODEL_LITE: ${LLM_MODEL_LITE:-doubao-seed-2.1-lite}
  LLM_TIER_DEFAULT: ${LLM_TIER_DEFAULT:-turbo}
  LLM_TIER_OVERRIDES: ${LLM_TIER_OVERRIDES:-{}}
  LLM_IS_REASONING: ${LLM_IS_REASONING:-true}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-doubao-embedding-vision}
  EMBEDDING_TRUNCATE_TO: ${EMBEDDING_TRUNCATE_TO:-0}
  # 默认关：推理模型逐条打标成本不可接受
  ENRICH_USE_LLM: ${ENRICH_USE_LLM:-false}
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
  TUSHARE_QPS: ${TUSHARE_QPS:-3.0}
  ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-8}
  ARQ_JOB_TIMEOUT: ${ARQ_JOB_TIMEOUT:-900}
  REVIEW_MAX_CONCURRENCY: ${REVIEW_MAX_CONCURRENCY:-5}

x-api-build: &api-build
  context: ./apps/api
  dockerfile: Dockerfile
  target: runtime

services:
  # ---------------------------------------------------------------- 基础设施
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nda-app-postgres
    environment:
      POSTGRES_USER: nda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nda}
      POSTGRES_DB: nda
    volumes:
      - app-pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nda -d nda"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # 只在内部网络暴露。需要在宿主机连：make db-shell

  redis:
    image: redis:7-alpine
    container_name: nda-app-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - app-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    # ★ MinIO 已从 Docker Hub 下线，镜像只在 Quay（用 minio/minio 会报
    #   "pull access denied ... repository does not exist"）
    image: quay.io/minio/minio:latest
    container_name: nda-app-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nda}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nda123456}
    volumes:
      - app-minio-data:/data
    healthcheck:
      # 服务镜像里没有 mc，用内置的 curl 打健康端点
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ---------------------------------------------------------------- 迁移（一次性）
  migrate:
    build: *api-build
    image: nda-api:latest
    container_name: nda-app-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  # ---------------------------------------------------------------- API
  api:
    build: *api-build
    image: nda-api:latest
    container_name: nda-app-api
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------- Worker（同步 / 打标 / 检查队列）
  worker:
    build: *api-build
    image: nda-api:latest
    container_name: nda-app-worker
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *api-env
    # ★ 不能沿用镜像级 HEALTHCHECK（它打的是 uvicorn 的 /health，worker 不监听端口）。
    #   改用 arq 自带的健康 beacon：WorkerSettings.health_check_interval=30，
    #   每 30s 写一次 arq:queue:health-check，值是可读的运行统计，TTL = interval+1s。
    #   于是「key 存在」⟺「worker 还活着」——进程卡死或被杀后 31s 内 key 自动消失，
    #   这比只看日志可靠（日志只能发现"退出了"，发现不了"卡住但没退出"）。
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os,redis,sys;sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).get('arq:queue:health-check') else 1)\""
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------- Web（SPA + /api 反代）
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runtime
    image: nda-web:latest
    container_name: nda-app-web
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-pgdata:
  app-redisdata:
  app-minio-data:
